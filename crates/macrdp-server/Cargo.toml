[package]
name = "macrdp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
macrdp-capture = { path = "../macrdp-capture" }
macrdp-input = { path = "../macrdp-input" }
macrdp-encode = { path = "../macrdp-encode" }
macrdp-audio = { path = "../macrdp-audio" }
macrdp-clipboard = { path = "../macrdp-clipboard" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
bytes.workspace = true
ironrdp-server = { version = "0.13", features = ["helper", "egfx"] }
ironrdp-egfx = "0.3"
ironrdp-graphics = "0.9"
ironrdp-dvc = "0.8"
ironrdp-svc = "0.8"
ironrdp-pdu = "0.9"
ironrdp-displaycontrol = "0.8"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rcgen = "0.13"
dirs = "6"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
