[workspace]
resolver = "2"
members = [
    "crates/macrdp-server",
    "crates/macrdp-capture",
    "crates/macrdp-input",
    "crates/macrdp-encode",
    "crates/macrdp-audio",
    "crates/macrdp-clipboard",
]

# IronRDP with macrdp's changes: branch "macrdp" of https://github.com/rophy/IronRDP.
# All ironrdp crates come from the same commit, so that each crate exists only once.
[patch.crates-io]
ironrdp-acceptor = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-ainput = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-async = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-cliprdr = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-connector = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-core = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-displaycontrol = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-dvc = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-error = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-graphics = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-pdu = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-rdpsnd = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-server = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-svc = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }
ironrdp-tokio = { git = "https://github.com/rophy/IronRDP", rev = "81ba019228895f1697172e1ee69fa4c67137d997" }

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"
